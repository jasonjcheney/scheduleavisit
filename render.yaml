services:
  - type: web
    name: scheduleavisit
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m uvicorn app:app --host 0.0.0.0 --port $PORT
    disk:
      name: disk
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: SAV_DB
        value: /opt/render/project/src/data/app.db
